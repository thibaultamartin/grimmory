name: Docker Compose Health Check

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - support-healthchecks-ci

jobs:
  compose-healthcheck:
    name: Build, Compose, and Health Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Create Compose Override for Local Image
        run: |
          cat > compose.ci-override.yml << 'CIEOF'
          services:
            grimmory:
              build: .
          CIEOF

      - name: Start Compose Stack
        run: |
          docker compose \
            -f deploy/compose/docker-compose.yml \
            -f compose.ci-override.yml \
            up -d

      - name: Wait for Healthcheck
        run: |
          echo "Waiting for grimmory to pass its Docker healthcheck..."
          max_attempts=60
          for i in $(seq 1 $max_attempts); do
            container_id="$(docker ps -q --filter name=grimmory 2>/dev/null || true)"
            if [ -z "$container_id" ]; then
              echo "Attempt $i: container not yet running"
              sleep 10
              continue
            fi

            status="$(docker inspect --format='{{json .State.Health.Status}}' "$container_id" 2>/dev/null || echo "null")"

            # Unquote the json string
            status="$(echo "$status" | tr -d '"')"

            echo "Attempt $i/$max_attempts: Health status = $status"

            case "$status" in
              healthy)
                echo "✅ grimmory is healthy!"
                exit 0
                ;;
              unhealthy)
                echo "❌ grimmory is unhealthy — failing fast"
                exit 1
                ;;
              *)
                # still starting or status unknown
                ;;
            esac
            sleep 10
          done

          echo "❌ Timed out waiting for grimmory to become healthy"
          exit 1
